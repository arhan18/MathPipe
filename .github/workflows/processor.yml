name: Conversion worker

on:
  schedule:
    # Every minute. GitHub cron is best-effort (runs can start a few minutes late).
    - cron: "* * * * *"
  workflow_dispatch:

concurrency:
  group: mathpipe-conversion-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/processor/requirements.txt

      - name: Install worker dependencies
        working-directory: apps/processor
        run: pip install -r requirements.txt

      - name: Drain queued conversions
        working-directory: apps/processor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MATHPIPE_BUCKET: mathpipe-files
        run: python -m worker.service --once --limit 5
