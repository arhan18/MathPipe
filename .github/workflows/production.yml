name: Production deploy

on:
  workflow_dispatch:

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Gate — all staging checks green, license gate unchanged, migrations reviewed
        run: echo "Manual approval required (environment protection rule)"
      - uses: pnpm/action-setup@v4
        with:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
